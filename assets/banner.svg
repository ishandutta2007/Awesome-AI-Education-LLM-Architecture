<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="40%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <radialGradient id="glowGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-30px) translateX(20px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    .particle-1 { animation: floatParticle 8s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 11s ease-in-out infinite 2s; }
    .particle-3 { animation: floatParticle 9s ease-in-out infinite 4s; }
    .pulse-bg { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 12; animation: dashCycle 25s linear infinite; }
    .wave-anim { animation: waveFlow 12s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -1px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .badge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <circle cx="600" cy="180" r="450" fill="url(#glowGlow)" class="pulse-bg" />

  <!-- Animated Tech Flow Lines (Background) -->
  <g opacity="0.25" class="wave-anim">
    <path class="flow-line" d="M -50,100 C 250,30 400,220 700,90 C 950,-20 1050,180 1250,110" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="flow-line" d="M -50,220 C 200,320 500,140 800,290 C 1000,380 1100,240 1250,280" fill="none" stroke="#a855f7" stroke-width="2" style="animation-duration: 32s;" />
    <path class="flow-line" d="M -50,340 C 300,260 600,380 900,250 C 1100,160 1150,330 1250,360" fill="none" stroke="#38bdf8" stroke-width="1.5" style="animation-duration: 20s;" />
  </g>

  <!-- Dynamic Animated Floating Nodes / Particles (Behind text) -->
  <g>
    <circle cx="180" cy="110" r="4" fill="#38bdf8" class="particle-1" />
    <circle cx="280" cy="70" r="3" fill="#a855f7" class="particle-2" />
    <circle cx="1020" cy="90" r="5" fill="#ec4899" class="particle-3" />
    <circle cx="940" cy="150" r="3" fill="#6366f1" class="particle-1" />
    <circle cx="140" cy="270" r="4" fill="#818cf8" class="particle-2" />
    <circle cx="1080" cy="290" r="4" fill="#38bdf8" class="particle-3" />
    <circle cx="580" cy="60" r="3" fill="#c084fc" class="particle-1" />
  </g>

  <!-- Foreground Main Title & Subtitle Elements -->
  <!-- Category Pill -->
  <g transform="translate(600, 75)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9" />
    <text text-anchor="middle" y="5" fill="#a5b4fc" class="badge-label" letter-spacing="1">🚀 ULTIMATE LLM &amp; AI LEARNING CURRICULUM</text>
  </g>

  <!-- Headline -->
  <text text-anchor="middle" x="600" y="165" fill="#ffffff" class="title-text" font-size="46" filter="url(#cardShadow)">
    Awesome AI Education &amp; LLM Architecture
  </text>
  <text text-anchor="middle" x="600" y="165" fill="url(#primaryGrad)" class="title-text" font-size="46" opacity="0.3" filter="url(#neonGlow)">
    Awesome AI Education &amp; LLM Architecture
  </text>

  <!-- Subtitle -->
  <text text-anchor="middle" x="600" y="215" fill="#94a3b8" class="sub-text" font-size="20">
    Master Transformer Internals, Attention Mechanisms, Pretraining &amp; Fine-Tuning From Scratch
  </text>

  <!-- Decorative Interactive Floating Pill Badges in Foreground -->
  <g transform="translate(180, 290)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="52" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="10" y="12" width="28" height="28" rx="8" fill="#4338ca" />
      <text x="24" y="31" fill="#ffffff" text-anchor="middle" font-size="14">⚡</text>
      <text x="48" y="26" fill="#f8fafc" class="sub-text" font-weight="600" font-size="13">LLMs From Scratch</text>
      <text x="48" y="41" fill="#94a3b8" class="sub-text" font-size="11">Attention &amp; PyTorch</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="180" height="52" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="10" y="12" width="28" height="28" rx="8" fill="#0f766e" />
      <text x="24" y="31" fill="#ffffff" text-anchor="middle" font-size="14">🧠</text>
      <text x="48" y="26" fill="#f8fafc" class="sub-text" font-weight="600" font-size="13">Transformers</text>
      <text x="48" y="41" fill="#94a3b8" class="sub-text" font-size="11">nanoGPT &amp; minGPT</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="180" height="52" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="10" y="12" width="28" height="28" rx="8" fill="#701a75" />
      <text x="24" y="31" fill="#ffffff" text-anchor="middle" font-size="14">🎓</text>
      <text x="48" y="26" fill="#f8fafc" class="sub-text" font-weight="600" font-size="13">SaaS &amp; Academics</text>
      <text x="48" y="41" fill="#94a3b8" class="sub-text" font-size="11">Coursera &amp; fast.ai</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(660, 0)">
      <rect x="0" y="0" width="180" height="52" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="10" y="12" width="28" height="28" rx="8" fill="#be123c" />
      <text x="24" y="31" fill="#ffffff" text-anchor="middle" font-size="14">🚀</text>
      <text x="48" y="26" fill="#f8fafc" class="sub-text" font-weight="600" font-size="13">Production MLOps</text>
      <text x="48" y="41" fill="#94a3b8" class="sub-text" font-size="11">vLLM &amp; Unsloth</text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="0" y="0" width="1200" height="420" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" />
</svg>
